<!DOCTYPE html>
<html lang="en">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<style>
  :root { --cyan:#39e6ff; --violet:#c46bff; --green:#7cffb2; --amber:#ffd34d; --ember:#ff8a5c; --pink:#ff6ec7; --ink:#05031a;
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --fd:'Space Grotesk',system-ui,sans-serif; --ease:cubic-bezier(0.22,1,0.36,1); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--ink); color:#dbe8ff; font-family:"Inter",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  button { font:inherit; color:inherit; }
  [hidden] { display:none !important; }
  #stage { position:fixed; inset:0; overflow:hidden; background:var(--ink); }
  #three-canvas { position:absolute; inset:0; z-index:0; } #three-canvas canvas { display:block; width:100%; height:100%; }
  #songCv { position:absolute; inset:0; z-index:6; touch-action:none; pointer-events:none; } #songCv.on { pointer-events:auto; }
  #vignette { position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(3,0,12,0.55) 100%); }
  #flash { position:absolute; inset:0; z-index:40; background:#05031a; opacity:0; pointer-events:none; transition:opacity 0.22s ease; }
  /* the fallback when WebGL is missing: the art as a picture */
  #artFb { display:none; position:absolute; inset:0; z-index:0; background:#0a0420 url(assets/character/queen-960.webp) no-repeat; background-size:auto 92%; background-position:22% 50%; }
  .nogl #artFb { display:block; } @media (max-aspect-ratio:21/20){ #artFb { background-position:50% 12%; background-size:auto 60%; } }

  /* top bar */
  .hud { position:absolute; z-index:30; top:calc(8px + var(--st)); left:calc(10px + var(--sl)); right:calc(10px + var(--sr)); display:flex; align-items:center; gap:8px; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .hbtn { min-width:44px; height:44px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font:700 12px/1 var(--fd); letter-spacing:0.08em; text-transform:uppercase; text-decoration:none; color:#b8cbe0; background:rgba(10,3,26,0.55); border:1px solid rgba(159,182,200,0.28); border-radius:12px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; transition:border-color .2s, color .2s, transform .15s var(--ease); }
  .hbtn:hover, .hbtn:focus-visible { color:#fff; border-color:var(--cyan); outline:none; } .hbtn:active { transform:scale(0.95); }
  .sp { flex:1; }
  .pips { display:flex; gap:12px; padding:8px 12px; border-radius:12px; background:rgba(10,3,26,0.5); border:1px solid rgba(159,182,200,0.18); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); opacity:0; transition:opacity .6s; }
  .pips.on { opacity:1; } .pip { display:flex; align-items:center; gap:5px; font:700 12px/1 var(--fd); } .pip i { font-style:normal; font-size:13px; } .pip b { display:flex; gap:3px; } .pip b u { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.16); } .pip b u.f { box-shadow:0 0 8px currentColor; background:currentColor; }
  .pip.bump { animation:bump .7s var(--ease); } @keyframes bump { 30% { transform:scale(1.35); } }
  @media (max-width:560px) { .hud { gap:6px; } .hbtn { min-width:44px; padding:0 10px; } .hbtn .lbl { display:none; } .pips { gap:8px; padding:8px 9px; } .pip { gap:3px; } .pip b { gap:2px; } .pip b u { width:6px; height:6px; } .hud .sp { flex:0 0 0; } .hud .pips { margin:0 auto; } }
  .p-h { color:var(--pink); } .p-r { color:var(--amber); } .p-t { color:var(--green); }

  /* the dialogue card: beside the scene on a wide screen, under it on a tall one */
  .card { position:absolute; z-index:20; right:calc(14px + var(--sr)); top:calc(60px + var(--st)); bottom:calc(14px + var(--sb)); width:min(47vw, 480px); display:flex; flex-direction:column; justify-content:center; pointer-events:none; }
  .panel { pointer-events:auto; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:clamp(16px,2.6vw,26px); border-radius:20px; background:linear-gradient(160deg, rgba(18,12,42,0.84), rgba(8,5,22,0.9)); border:1px solid rgba(196,107,255,0.3); box-shadow:0 24px 70px rgba(0,0,0,0.55), 0 0 50px rgba(111,91,255,0.14); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); animation:cardIn .55s var(--ease) both; }
  @keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(0.98); } to { opacity:1; transform:none; } }
  .chap { font:700 11.5px/1 var(--fd); letter-spacing:0.2em; text-transform:uppercase; color:#8fa0c0; }
  .who { display:flex; align-items:center; gap:9px; margin-top:12px; font:700 14px/1 var(--fd); letter-spacing:0.12em; text-transform:uppercase; }
  .who::before { content:""; width:9px; height:9px; border-radius:50%; background:currentColor; box-shadow:0 0 12px currentColor; }
  .say { margin-top:10px; min-height:4.6em; font-size:clamp(14.5px, 1.2vw + 10px, 18px); line-height:1.6; color:#eef3ff; text-wrap:pretty; }
  .say .cur { display:inline-block; width:2px; height:1em; margin-left:2px; vertical-align:-2px; background:var(--cyan); animation:blink .8s steps(2) infinite; } @keyframes blink { 50% { opacity:0; } }
  .opts { margin-top:14px; display:flex; flex-direction:column; gap:9px; opacity:0; transform:translateY(8px); transition:opacity .45s, transform .45s var(--ease); pointer-events:none; } .opts.on { opacity:1; transform:none; pointer-events:auto; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:11px 18px; border-radius:999px; border:1px solid rgba(196,107,255,0.4); background:rgba(255,255,255,0.06); font:600 15px/1.25 var(--fd); text-align:left; cursor:pointer; transition:transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s; }
  .opt::before { content:""; width:8px; height:8px; flex:none; border-radius:50%; background:var(--violet); box-shadow:0 0 10px var(--violet); }
  .opt:hover, .opt:focus-visible { transform:translateY(-2px); background:rgba(196,107,255,0.2); border-color:rgba(196,107,255,0.7); box-shadow:0 14px 34px -12px rgba(111,91,255,0.5); outline:none; } .opt:active { transform:scale(0.98); }
  .opt.go { justify-content:center; border-color:rgba(57,230,255,0.6); background:rgba(57,230,255,0.14); } .opt.go::before { background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
  .skip { margin-top:8px; text-align:right; font-size:11.5px; color:#6d7894; letter-spacing:0.06em; min-height:14px; }
  @media (max-aspect-ratio:21/20) {
    .card { left:calc(10px + var(--sl)); right:calc(10px + var(--sr)); top:auto; bottom:calc(10px + var(--sb)); width:auto; max-height:52%; justify-content:flex-end; }
  }
  @media (max-height:430px) and (min-aspect-ratio:21/20) { .panel { padding:12px 16px; } .say { font-size:14.5px; line-height:1.5; margin-top:6px; min-height:0; } .who { margin-top:8px; } .opts { margin-top:10px; gap:7px; } .opt { min-height:44px; padding:8px 16px; font-size:14.5px; } .card { top:calc(56px + var(--st)); } }

  /* title / ending / echoes */
  .ov { position:absolute; inset:0; z-index:35; display:flex; align-items:center; justify-content:center; padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl)); background:radial-gradient(900px 600px at 50% 40%, rgba(10,3,26,0.5), rgba(3,0,10,0.9)); backdrop-filter:blur(2px); transition:opacity .6s ease; overflow-y:auto; }
  .ov.hidden { opacity:0; pointer-events:none; visibility:hidden; }
  .box { width:100%; max-width:560px; text-align:center; animation:cardIn .7s var(--ease) both; }
  .kick { font:700 11.5px/1 var(--fd); letter-spacing:0.24em; text-transform:uppercase; color:var(--cyan); }
  .logo { margin-top:14px; font:700 clamp(40px,9vw,76px)/0.95 var(--fd); letter-spacing:-0.03em; color:#fff; text-shadow:0 0 40px rgba(196,107,255,0.55); }
  .logo em { font-style:normal; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin:14px auto 0; max-width:440px; font-size:clamp(14.5px,2vw,17px); line-height:1.55; color:#b9c6e0; }
  .row { margin-top:22px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .big { min-height:52px; padding:13px 28px; border-radius:999px; border:1px solid rgba(57,230,255,0.7); background:linear-gradient(120deg, rgba(57,230,255,0.22), rgba(196,107,255,0.28)); font:700 16px/1 var(--fd); letter-spacing:0.04em; color:#fff; cursor:pointer; box-shadow:0 12px 40px -12px rgba(57,230,255,0.6); transition:transform .2s var(--ease), box-shadow .2s; }
  .big:hover, .big:focus-visible { transform:translateY(-2px); outline:none; } .big:active { transform:scale(0.97); } .big.ghost { border-color:rgba(196,107,255,0.45); background:rgba(255,255,255,0.06); box-shadow:none; }
  .meta { margin-top:18px; font-size:13px; color:#8fa0c0; } .meta b { color:var(--cyan); }
  .ename { margin-top:12px; font:700 clamp(26px,6vw,40px)/1.05 var(--fd); color:#fff; letter-spacing:-0.02em; text-shadow:0 0 30px rgba(196,107,255,0.5); }
  .etext { margin:16px auto 0; max-width:480px; font-size:clamp(14.5px,2vw,17px); line-height:1.65; color:#dbe6fb; }
  .dots { margin-top:16px; display:flex; gap:8px; justify-content:center; } .dots i { width:34px; height:6px; border-radius:3px; background:rgba(255,255,255,0.14); } .dots i.f { background:linear-gradient(90deg,var(--cyan),var(--violet)); box-shadow:0 0 10px rgba(57,230,255,0.5); }
  .glist { margin-top:16px; display:grid; gap:9px; text-align:left; }
  .gi { padding:12px 16px; border-radius:14px; border:1px solid rgba(196,107,255,0.22); background:rgba(255,255,255,0.05); } .gi.f { border-color:rgba(57,230,255,0.5); background:rgba(57,230,255,0.08); }
  .gi h3 { font:700 15px/1.2 var(--fd); color:#fff; } .gi p { margin-top:4px; font-size:13px; line-height:1.45; color:#9fb0cc; } .gi:not(.f) h3 { color:#7d89a6; }

  /* the ending sits beside the open gate (wide) or under it (tall), in a glass card, so the gate stays in view */
  #end { background:none; backdrop-filter:none; -webkit-backdrop-filter:none; justify-content:flex-end; padding-right:calc(14px + var(--sr)); pointer-events:none; } #end .box { pointer-events:auto; max-width:min(47vw,500px); padding:clamp(18px,3vw,30px); border-radius:22px; background:linear-gradient(160deg, rgba(18,12,42,0.86), rgba(8,5,22,0.92)); border:1px solid rgba(196,107,255,0.3); box-shadow:0 24px 70px rgba(0,0,0,0.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  @media (max-aspect-ratio:21/20) { #end { justify-content:center; align-items:flex-end; padding:0 calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl)); } #end .box { max-width:560px; max-height:56%; overflow-y:auto; } }
  /* preloader */
  #pre { position:absolute; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--ink); transition:opacity .6s ease, visibility .6s; }
  #pre.done { opacity:0; visibility:hidden; pointer-events:none; } #pre .pl { font:700 clamp(26px,6vw,40px)/1 var(--fd); letter-spacing:-0.02em; color:#fff; } #pre .pl em { font-style:normal; color:var(--violet); }
  #pre .bar { width:min(220px,60vw); height:2px; background:rgba(255,255,255,0.12); overflow:hidden; } #pre .bar span { display:block; height:100%; width:40%; background:linear-gradient(90deg,var(--cyan),var(--violet)); animation:ld 1.1s ease-in-out infinite; } @keyframes ld { from { transform:translateX(-100%); } to { transform:translateX(260%); } }
  @media (max-height:430px) { .logo { margin-top:8px; font-size:clamp(28px,10vh,44px); line-height:1; } .logo br { display:none; } .tag { margin-top:8px; font-size:13.5px; line-height:1.45; max-width:520px; } .row { margin-top:14px; } .big { min-height:46px; padding:10px 20px; font-size:14.5px; } #end .row { gap:8px; flex-wrap:nowrap; } #end .big { padding:10px 14px; } .meta { margin-top:10px; font-size:12.5px; } .ename { font-size:clamp(22px,8vh,32px); margin-top:6px; } .etext { margin-top:8px; font-size:13.5px; line-height:1.5; } .dots { margin-top:10px; } .gi { padding:8px 12px; } .gi p { font-size:12px; } .glist { margin-top:10px; gap:6px; } }
  @media (prefers-reduced-motion: reduce) { .panel,.box { animation:none; } #pre .bar span { animation:none; width:100%; } .opts { transition:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="artFb" aria-hidden="true"></div>
  <div id="three-canvas" aria-hidden="true"></div>
  <div id="vignette"></div>
  <canvas id="songCv" aria-label="Song of Recall: tap the lanes as the notes reach the light"></canvas>
  <div id="flash"></div>

  <div class="hud" id="hud">
    <a class="hbtn" href="../../index.html#games" aria-label="Back to the studio">&larr; <span class="lbl">Studio</span></a>
    <div class="sp"></div>
    <div class="pips" id="pips" aria-label="Heart, resolve and trust">
      <span class="pip p-h" id="pipH"><i>&hearts;</i><b></b></span><span class="pip p-r" id="pipR"><i>&#9670;</i><b></b></span><span class="pip p-t" id="pipT"><i>&#10022;</i><b></b></span>
    </div>
    <div class="sp"></div>
    <button class="hbtn" id="echoBtn" type="button" aria-label="Endings found">&#10022; <span id="echoN">0/5</span></button>
    <button class="hbtn" id="sndBtn" type="button" aria-label="Toggle sound" aria-pressed="false">&#128266;</button>
  </div>

  <div class="card" id="card" hidden>
    <div class="panel" id="panel">
      <div class="chap" id="chap"></div>
      <div class="who" id="who"></div>
      <div class="say" id="say" aria-live="polite"></div>
      <div class="opts" id="opts"></div>
      <div class="skip" id="skip"></div>
    </div>
  </div>

  <div class="ov" id="title">
    <div class="box">
      <div class="kick">&#11041; Kudbee Games</div>
      <div class="logo">Abyss <em>&middot;</em><br>The Guardian&rsquo;s Gate</div>
      <p class="tag">An interactive 3D story. Choose your path, play the Song of Recall on her flute, and find all five endings.</p>
      <div class="row"><button class="big" id="beginBtn" type="button">&#9654; Begin</button><button class="big ghost" id="contBtn" type="button" hidden>Continue</button></div>
      <div class="meta" id="titleMeta"></div>
    </div>
  </div>

  <div class="ov hidden" id="end">
    <div class="box">
      <div class="kick" id="eKick">The End</div>
      <div class="ename" id="eName"></div>
      <p class="etext" id="eText"></p>
      <div class="dots" id="eDots"></div>
      <div class="meta" id="eMeta"></div>
      <div class="row"><button class="big" id="shareBtn" type="button">Share your ending</button><button class="big ghost" id="againBtn" type="button">&#9654; Play again</button></div>
    </div>
  </div>

  <div class="ov hidden" id="echoes">
    <div class="box">
      <div class="kick">Echoes</div>
      <div class="ename" style="font-size:clamp(22px,5vw,32px)">Five ways the gate can open</div>
      <div class="glist" id="gList"></div>
      <div class="row"><button class="big ghost" id="echoClose" type="button">Close</button></div>
    </div>
  </div>

  <div id="pre"><div class="pl">Abyss <em>&middot;</em> Gate</div><div class="bar"><span></span></div></div>
</div>

<script src="src/story.js"></script>
<script src="src/fx.js"></script>
<script src="src/scene.js"></script>
<script src="src/song.js"></script>
<script src="src/game.js"></script>
</body>
</html>
