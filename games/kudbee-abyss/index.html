<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05031a">
<meta name="description" content="Kudbee Abyss — a 3D story game in three chapters. The masked queen awakens on a mysterious alien world, guided by a small creature and led to the Guardian's Gate. Art by Desiree Design.">
<title>Kudbee Abyss — The Guardian's Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --cyan:#39e6ff; --violet:#c46bff; --green:#7CFFb2; --amber:#ffd34d; --ember:#ff5d3c; --pink:#ff6ec7; --ink:#05031a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--ink); color:#cfe9ff; font-family:"Inter",system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 0%, rgba(106,15,204,0.12), transparent 60%), var(--ink); }
  #frame { position:relative; width:min(100vw, calc(100vh * 1.5)); height:min(100vh, calc(100vw / 1.5));
    box-shadow:0 0 80px rgba(106,15,204,0.30), inset 0 0 0 1px rgba(57,230,255,0.12);
    border-radius:14px; overflow:hidden; background:#05031a; }
  #three-canvas { position:absolute; inset:0; z-index:0; }
  #three-canvas canvas { display:block; width:100%; height:100%; }
  .back-link { position:absolute; top:10px; left:12px; z-index:30; font-size:12px; letter-spacing:0.06em;
    text-transform:uppercase; color:#9fb6c8; text-decoration:none; padding:6px 10px;
    border:1px solid rgba(159,182,200,0.25); border-radius:6px; background:rgba(10,3,26,0.5); backdrop-filter:blur(6px); }
  .back-link:hover { color:#fff; border-color:var(--cyan); }
  .snd-btn { position:absolute; top:10px; right:12px; z-index:30; font-size:14px; line-height:1;
    color:#9fb6c8; padding:6px 10px; border:1px solid rgba(159,182,200,0.25); border-radius:6px;
    background:rgba(10,3,26,0.5); backdrop-filter:blur(6px); cursor:pointer; }
  .snd-btn:hover { color:#fff; border-color:var(--cyan); }

  .overlay { position:absolute; inset:0; z-index:25; display:flex; align-items:center; justify-content:center;
    padding:24px; background:radial-gradient(900px 600px at 50% 35%, rgba(10,3,26,0.70), rgba(3,0,10,0.96));
    backdrop-filter:blur(3px); transition:opacity 0.5s ease; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .page { position:relative; width:100%; max-width:640px; text-align:center;
    background:linear-gradient(160deg, rgba(15,12,35,0.92), rgba(8,6,20,0.96));
    border:1px solid rgba(196,107,255,0.22); border-radius:22px; padding:clamp(24px,5vw,44px);
    box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(111,91,255,0.12); }
  @media (max-width: 640px) {
    .overlay { padding:18px; }
    .page { padding:22px 18px; border-radius:18px; }
  }

  .kicker { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:var(--cyan); }
  .chapter-label { margin-top:10px; font:700 clamp(22px,6vw,34px)/1.1 var(--fd); letter-spacing:-0.02em; color:#fff; }
  .chapter-title { margin-top:6px; font:600 clamp(14px,3.5vw,18px)/1.4 var(--fd); letter-spacing:0.04em; color:var(--violet); text-transform:uppercase; }
  .story-text { margin-top:22px; color:#e8eef8; font-size:clamp(15px,3.8vw,18px); line-height:1.65; max-width:520px; margin-left:auto; margin-right:auto; }
  .speaker { font-family:"Space Grotesk"; font-weight:700; color:var(--cyan); font-size:13px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:6px; }
  .hint { margin-top:22px; font-size:12px; color:#5a6276; letter-spacing:0.05em; }
  .story-actions { margin-top:26px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 26px; border:none; border-radius:999px;
    cursor:pointer; background:linear-gradient(135deg,#39e6ff,#6f5bff 50%,#c46bff); color:#05031a;
    font-family:"Space Grotesk"; font-weight:700; font-size:15px; box-shadow:0 12px 34px -10px rgba(111,91,255,0.7); }
  .btn:hover { filter:brightness(1.06); }
  .btn.secondary { background:rgba(255,255,255,0.08); color:#cfe9ff; border:1px solid rgba(255,255,255,0.14); box-shadow:none; }
  .page-indicator { margin-top:18px; font:600 11px/1 var(--fd); letter-spacing:0.2em; color:#5a6276; text-transform:uppercase; }
  @media (pointer:coarse){ .hint { display:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <a class="back-link" href="../../index.html#games">&larr; Studio</a>
    <button class="snd-btn" id="sndBtn" aria-label="Toggle sound" aria-pressed="false">🔊</button>
    <div id="three-canvas"></div>

    <div class="overlay" id="gate">
      <div class="page" id="page">
        <div class="kicker">⬡ Kudbee Games · Abyss</div>
        <div class="chapter-label" id="chapterLabel">Chapter 1</div>
        <div class="chapter-title" id="chapterTitle">The Awakening</div>
        <div class="story-text" id="storyText"></div>
        <div class="hint" id="hint">Press Enter or tap Next to continue</div>
        <div class="story-actions">
          <button class="btn secondary" id="prevBtn" type="button">← Prev</button>
          <button class="btn" id="nextBtn" type="button">Next →</button>
        </div>
        <div class="page-indicator" id="pageIndicator">1 / 1</div>
      </div>
    </div>

    <div class="overlay hidden" id="end">
      <div class="page">
        <div class="kicker">The End</div>
        <div class="chapter-label">The Guardian's Gate</div>
        <p class="story-text" style="margin-top:22px">The gate opens. The corruption dissipates. At last, peace. And in the distance, another gate shimmered — another echo called her name.</p>
        <div class="story-actions">
          <button class="btn" id="replayBtn" type="button">▶ Play Again</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== story data =====
  var chapters = [
    {
      title: 'Chapter 1',
      label: 'The Awakening',
      scenes: [
        { s: 'NARRATOR', t: 'Consciousness returns in fragments. The void whispers a name she cannot remember. All that remains is the weight of the flute at her back, and the echo of its song in her blood.' },
        { s: 'QUEEN', t: 'Where is this place? The sky bleeds violet, and the stones beneath me hum with an alien resonance. I do not know who I am. But my hands remember.' },
        { s: 'NARRATOR', t: 'She rises. Crystalline spires jut from cracked earth, and in the haze two figures wait — one small, one towering.' },
        { s: 'QUEEN', t: 'There. Behind that pillar, something cowering in fear. Further still, a guardian carved from night. It watches me.' },
        { s: 'NARRATOR', t: 'The flute begins to sing. A low note, building to a crescendo. Memory flows like starlight: a queen, a kingdom, a betrayal, an exile. The song is a key, and it remembers the lock.' }
      ]
    },
    {
      title: 'Chapter 2',
      label: 'The Companion',
      scenes: [
        { s: 'QUEEN', t: 'Child-thing, do not hide. I mean you no harm. My flute... it calls to yours, does it not?' },
        { s: 'CREATURE', t: 'The song-mark! You bear the Echo-Flute of the First Court. My name is Vey — I was left here to guard the gate. The corruption... it took the Guardian. It must be undone.' },
        { s: 'QUEEN', t: 'The Guardian. It stands at the precipice, does it not? A sentinel turned to shadow. Can it be saved?' },
        { s: 'VEY', t: 'Only if its heart still remembers. Strike its shield first — the flute\'s resonance breaks what the corruption binds. But beware: once the shield falls, the true guardian emerges.' },
        { s: 'QUEEN', t: 'Then I will play the Song of Recall. But I need the Resonance Crystal to amplify the flute — it sits atop the broken spire, past the pillars of old.' },
        { s: 'VEY', t: 'I will follow. But the Guardian stirs as you approach. It will not wait for you to be ready.' }
      ]
    },
    {
      title: 'Chapter 3',
      label: "The Guardian's Gate",
      scenes: [
        { s: 'QUEEN', t: 'The crystal hums against my flute. The song grows stronger. I can feel the Guardian\'s awareness turning toward me.' },
        { s: 'VEY', t: 'Behind me. It sees you now. Be still — it does not come to destroy. It comes to remember.' },
        { s: 'GUARDIAN', t: '...you... carry the echo... my lady... the corruption... it burns...' },
        { s: 'QUEEN', t: 'I remember now. You were my captain, my shield, my brother. The crown of shadows deceived you. Let me free you.' },
        { s: 'GUARDIAN', t: 'The song... it remembers everything...' },
        { s: 'NARRATOR', t: 'The gate opens. The corruption dissipates. At last, peace.' },
        { s: 'QUEEN', t: 'The flute falls silent. But I know now — I am the Queen of the Void Court. And this is but the first gate.' },
        { s: 'NARRATOR', t: 'And so the Queen, with flute and memory, restored what was lost. Yet in the distance, another gate shimmered — and another echo called her name.' }
      ]
    }
  ];

  // ===== audio =====
  var AC = null, mGain = null, muted = false;
  try { muted = localStorage.getItem('kudbee.abyss.muted') === '1'; } catch (e) {}
  function audioInit() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    var Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return;
    try { AC = new Ctor(); } catch (e) { return; }
    mGain = AC.createGain(); mGain.gain.value = muted ? 0 : 0.25; mGain.connect(AC.destination);
  }
  function setMuted(m) {
    muted = m; if (mGain) mGain.gain.value = muted ? 0 : 0.25;
    try { localStorage.setItem('kudbee.abyss.muted', muted ? '1' : '0'); } catch (e) {}
    var btn = document.getElementById('sndBtn');
    if (btn) { btn.textContent = muted ? '🔇' : '🔊'; btn.setAttribute('aria-pressed', muted ? 'true' : 'false'); }
  }
  function tone(freq, dur, type, vol, slideTo, at) {
    if (!AC || muted) return;
    var t = AC.currentTime + (at || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(mGain); o.start(t); o.stop(t + dur + 0.03);
  }
  var sfxLast = {};
  function sfx(name) {
    if (!AC || muted) return;
    var now = performance.now();
    if (now - (sfxLast[name] || 0) < 25) return; sfxLast[name] = now;
    switch (name) {
      case 'page': tone(440, 0.12, 'sine', 0.12, 660); tone(660, 0.1, 'sine', 0.08, 990, 0.05); break;
      case 'chapter': tone(220, 0.25, 'sine', 0.18, 880); tone(330, 0.25, 'sine', 0.12, 1320, 0.08); break;
      case 'end': tone(110, 0.8, 'sine', 0.18, 55); tone(165, 0.6, 'sine', 0.12, 82, 0.1); break;
    }
  }

  // ===== three.js scene =====
  var scene, camera, renderer, queenPlane, leftPlane, rightPlane, stars;
  var threeReady = false;
  var artImg = new Image();
  artImg.src = 'assets/character/queen.png';

  function cropTexture(img, sx, sy, sw, sh) {
    var tex = new THREE.Texture(img);
    tex.offset.set(sx / img.width, sy / img.height);
    tex.repeat.set(sw / img.width, sh / img.height);
    tex.center.set(0.5, 0.5);
    tex.needsUpdate = true;
    return tex;
  }

  function createCharacterPlane(tex, width, height, x, z) {
    var geo = new THREE.PlaneGeometry(width, height);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 0, z);
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function initThree() {
    if (typeof THREE === 'undefined' || !artImg.complete) return;
    var container = document.getElementById('three-canvas');
    var rect = container.getBoundingClientRect();
    var W = rect.width, H = rect.height;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05031a);
    scene.fog = new THREE.FogExp2(0x05031a, 0.018);

    camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
    camera.position.set(0, 0, 7);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    var ambient = new THREE.AmbientLight(0x404060, 1.2);
    scene.add(ambient);
    var dir = new THREE.DirectionalLight(0xc46bff, 1.0);
    dir.position.set(5, 5, 5);
    scene.add(dir);
    var cyan = new THREE.PointLight(0x39e6ff, 1.2, 20);
    cyan.position.set(-4, 2, 3);
    scene.add(cyan);

    // stars
    var starGeo = new THREE.BufferGeometry();
    var starCount = 250;
    var positions = new Float32Array(starCount * 3);
    for (var i = 0; i < starCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 40;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 24;
      positions[i * 3 + 2] = -10 - Math.random() * 20;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.7 });
    stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // character planes
    var queenTex = cropTexture(artImg, 300, 0, 486, 1448);
    var leftTex = cropTexture(artImg, 0, 300, 300, 900);
    var rightTex = cropTexture(artImg, 786, 300, 300, 900);
    queenPlane = createCharacterPlane(queenTex, 2.4, 7.2, -1.2, 0);
    leftPlane = createCharacterPlane(leftTex, 1.4, 4.2, -3.5, -1);
    rightPlane = createCharacterPlane(rightTex, 1.4, 4.2, 3.5, -1);

    threeReady = true;
  }

  function showCharacter(speaker) {
    if (!threeReady) return;
    queenPlane.visible = false;
    leftPlane.visible = false;
    rightPlane.visible = false;
    if (speaker === 'QUEEN' || speaker === 'NARRATOR') queenPlane.visible = true;
    else if (speaker === 'CREATURE' || speaker === 'VEY') leftPlane.visible = true;
    else if (speaker === 'GUARDIAN') rightPlane.visible = true;
  }

  // ===== story state =====
  var currentChapter = 0, currentScene = 0;

  function chapterCount() { return chapters.length; }
  function sceneCount() { return chapters[currentChapter].scenes.length; }

  function renderScene() {
    var ch = chapters[currentChapter];
    var sc = ch.scenes[currentScene];
    document.getElementById('chapterLabel').textContent = ch.title;
    document.getElementById('chapterTitle').textContent = ch.label;
    document.getElementById('storyText').innerHTML = '<div class="speaker">' + sc.s + '</div>' + sc.t;
    document.getElementById('pageIndicator').textContent = (currentScene + 1) + ' / ' + sceneCount();
    document.getElementById('prevBtn').style.visibility = (currentChapter === 0 && currentScene === 0) ? 'hidden' : 'visible';
    document.getElementById('nextBtn').textContent = (currentChapter === chapterCount() - 1 && currentScene === sceneCount() - 1) ? 'Finish →' : 'Next →';
    showCharacter(sc.s);
    sfx('page');
  }

  function nextScene() {
    if (currentChapter === chapterCount() - 1 && currentScene === sceneCount() - 1) {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('end').classList.remove('hidden');
      sfx('end');
      return;
    }
    if (currentScene < sceneCount() - 1) {
      currentScene++;
    } else {
      currentChapter++;
      currentScene = 0;
      sfx('chapter');
    }
    renderScene();
  }

  function prevScene() {
    if (currentScene > 0) {
      currentScene--;
    } else if (currentChapter > 0) {
      currentChapter--;
      currentScene = chapters[currentChapter].scenes.length - 1;
    }
    renderScene();
  }

  function startStory() {
    audioInit();
    currentChapter = 0;
    currentScene = 0;
    document.getElementById('end').classList.add('hidden');
    document.getElementById('gate').classList.remove('hidden');
    renderScene();
  }

  // ===== input =====
  document.getElementById('nextBtn').addEventListener('click', function() { audioInit(); nextScene(); });
  document.getElementById('prevBtn').addEventListener('click', function() { audioInit(); prevScene(); });
  document.getElementById('replayBtn').addEventListener('click', startStory);
  document.getElementById('sndBtn').addEventListener('click', function() { audioInit(); setMuted(!muted); });
  setMuted(muted);

  window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    if (k === 'm' && !e.repeat) { setMuted(!muted); e.preventDefault(); return; }
    if (document.getElementById('gate').classList.contains('hidden')) {
      if (k === 'enter') { e.preventDefault(); startStory(); }
      return;
    }
    if (k === 'arrowright' || k === ' ') { e.preventDefault(); audioInit(); nextScene(); }
    if (k === 'arrowleft') { e.preventDefault(); audioInit(); prevScene(); }
  });

  // ===== init =====
  artImg.onload = initThree;
  initThree();

  // ===== loop =====
  function animate() {
    requestAnimationFrame(animate);
    var t = performance.now() * 0.001;
    if (threeReady) {
      queenPlane.rotation.y = Math.sin(t * 0.4) * 0.05;
      leftPlane.rotation.y = Math.sin(t * 0.5 + 1) * 0.05;
      rightPlane.rotation.y = Math.sin(t * 0.5 + 2) * 0.05;
      queenPlane.position.y = Math.sin(t * 0.8) * 0.05;
      leftPlane.position.y = Math.sin(t * 0.9 + 1) * 0.05;
      rightPlane.position.y = Math.sin(t * 0.9 + 2) * 0.05;
      stars.rotation.y = t * 0.01;
      renderer.render(scene, camera);
    }
  }
  animate();

  window.addEventListener('resize', function() {
    if (!threeReady) return;
    var container = document.getElementById('three-canvas');
    var rect = container.getBoundingClientRect();
    camera.aspect = rect.width / rect.height;
    camera.updateProjectionMatrix();
    renderer.setSize(rect.width, rect.height);
  });
})();
</script>
</body>
</html>
