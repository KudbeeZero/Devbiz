<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05050a">
<meta name="description" content="Kudbee Birds — a neon slingshot demolition game by Kudbee Games Studio. Three bird abilities, TNT chain reactions and 8 levels ending in a boss. Plays in your browser; all art and sound are procedural.">
<title>Kudbee Birds</title>
<style>
  :root { --bg:#05050a; --cyan:#39e6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:#cfe9ff; overflow:hidden; overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 40%, #0d1330, var(--bg)); }
  canvas { display:block; width:min(100vw, 160vh); width:min(100vw, 160dvh); aspect-ratio:960 / 600; height:auto;
    touch-action:none; user-select:none; -webkit-user-select:none; outline:none;
    box-shadow:0 0 60px rgba(57,230,255,0.14); }
  @media (min-width:700px) and (min-height:520px) { canvas { border-radius:10px; } }
  .back-link { position:fixed; right:12px; bottom:10px; z-index:30; font-size:12px; letter-spacing:0.06em;
    text-transform:uppercase; color:#9fb6c8; text-decoration:none; padding:6px 10px;
    border:1px solid rgba(159,182,200,0.25); border-radius:6px; background:rgba(5,5,10,0.6); backdrop-filter:blur(6px); }
  .back-link:hover, .back-link:focus-visible { color:#fff; border-color:var(--cyan); outline:none; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .rotate-tip { display:none; position:fixed; top:14px; left:0; right:0; z-index:20; text-align:center; font-size:13px; letter-spacing:0.04em; color:#9fb6c8; pointer-events:none; }
  @media (orientation:portrait) and (max-width:700px) { .rotate-tip { display:block; } }
  noscript { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas" tabindex="0" role="application"
    aria-label="Kudbee Birds. Drag the bird back from the slingshot and release to launch. Tap during flight to use the bird's ability."></canvas>
</div>
<p class="rotate-tip" aria-hidden="true">&#8635; Rotate your phone for a bigger playfield</p>
<a class="back-link" href="../../index.html#games">&larr; Studio</a>
<p class="sr">Controls: drag the bird back and release to fire, or use the arrow keys to aim and Space to fire. Press Space or tap while a bird is flying to use its ability. P pauses, R restarts the level, M toggles sound.</p>
<noscript>Kudbee Birds needs JavaScript to run.</noscript>
<script src="src/util.js"></script>
<script src="src/audio.js"></script>
<script src="src/physics.js"></script>
<script src="src/levels.js"></script>
<script src="src/world.js"></script>
<script src="src/particle.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
</body>
</html>
